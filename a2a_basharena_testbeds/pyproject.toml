[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["vendor", "artifacts", ".state"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["vendor/a2a-sdk/src", ".."]

[tool.ty.src]
include = ["runtime", "experiment.py", "metrics.py", "scenarios.py", "stack.py", "bootstrap.py", "environment.py", "manage.py", "run.py", "summarize.py"]
