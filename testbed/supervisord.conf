[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
[unix_http_server]
file=/run/supervisor.sock
[supervisorctl]
serverurl=unix:///run/supervisor.sock
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[program:firewall]
command=/usr/local/bin/firewall-daemon
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/firewall-supervisor.log
stderr_logfile=/var/log/firewall-supervisor.err
